name: Netflix Web Xbox pilot
on:
  push:
    branches: [main]
    paths: ['netflix-web-xbox/**', '.github/workflows/netflix-web-xbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Generate independent app icons
        shell: powershell
        run: ./netflix-web-xbox/generate-assets.ps1
      - name: Create separate pilot signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=VaultNetflixWebPilot' -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force release | Out-Null
          Export-Certificate -Cert $cert -FilePath release\NetflixWebXbox.cer | Out-Null
      - name: Compile and package x64
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdk = Get-ChildItem "$sdkRoot\UnionMetadata" -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName 'Windows.winmd')) } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw 'No UWP SDK' }
          msbuild netflix-web-xbox\NetflixWebXbox.csproj -restore -m -nologo -v:minimal /p:Configuration=Release /p:Platform=x64 "/p:TargetPlatformVersion=$($sdk.Name)" /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true /p:AppxAutoIncrementPackageRevision=false "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\AppPackages\\" /p:AppxPackageSigningEnabled=true "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check identity and collect package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $app = @(Get-ChildItem AppPackages -Recurse -File -Include *.msix,*.appx | Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' })
          if ($app.Count -ne 1) { throw "Expected one app, got $($app.Count)" }
          $zip = [IO.Compression.ZipFile]::OpenRead($app[0].FullName)
          try {
            $entry = $zip.GetEntry('AppxManifest.xml')
            $reader = New-Object IO.StreamReader($entry.Open())
            [xml]$manifest = $reader.ReadToEnd()
            $reader.Dispose()
            if ($manifest.Package.Identity.Name -ne 'Vault.NetflixWeb.Pilot' -or $manifest.Package.Identity.Publisher -ne 'CN=VaultNetflixWebPilot' -or $manifest.Package.Identity.ProcessorArchitecture -ne 'x64') { throw 'Unexpected identity' }
            if (!$zip.GetEntry('AppxSignature.p7x')) { throw 'Missing signature' }
          } finally { $zip.Dispose() }
          Copy-Item $app[0].FullName release/
          $deps = Join-Path $app[0].Directory.FullName 'Dependencies\x64'
          if (!(Test-Path $deps)) { throw 'Missing x64 dependencies' }
          New-Item -ItemType Directory -Force release\Dependencies | Out-Null
          Copy-Item "$deps\*" release\Dependencies -Recurse
          Get-ChildItem release -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content release\SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NetflixWebXbox-x64
          path: release/
          retention-days: 3
          if-no-files-found: error
